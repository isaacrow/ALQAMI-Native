name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Alqami Native IPA
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Print Xcode Version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Build iOS Application
        run: |
          cd ios
          xcodebuild build \
            -project AlqamiNative.xcodeproj \
            -scheme AlqamiNative \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO

      - name: Package IPA
        run: |
          cd ios
          mkdir -p build/Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r AlqamiNative.ipa Payload
          echo "IPA Package generated successfully at ios/build/AlqamiNative.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlqamiNative-iOS
          path: ios/build/AlqamiNative.ipa
          retention-days: 14
