name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Alqami Native IPA
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Build iOS Application
        run: |
          cd ios
          xcodebuild clean build \
            -project AlqamiNative.xcodeproj \
            -scheme AlqamiNative \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package IPA
        run: |
          cd ios
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "Found compiled app bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app found in build directory!"
            find build
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -r -y AlqamiNative.ipa Payload
          ls -lh AlqamiNative.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlqamiNative-iOS
          path: ios/AlqamiNative.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "ALQAMI Native v1.0.0 (iOS IPA)"
          body: |
            ## ALQAMI Native iOS IPA Release
            Download `AlqamiNative.ipa` below to install directly on your iPhone.
          files: ios/AlqamiNative.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
