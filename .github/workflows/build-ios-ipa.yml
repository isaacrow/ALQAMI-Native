name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Alqami Native IPA
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Build iOS Application
        run: |
          cd ios
          xcodebuild clean build \
            -project AlqamiNative.xcodeproj \
            -scheme AlqamiNative \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" > xcode_output.txt 2>&1 || BUILD_FAILED=1

          if [ "$BUILD_FAILED" = "1" ]; then
            echo "Build failed. Output log tail:"
            tail -n 80 xcode_output.txt
            exit 1
          fi

      - name: Save Log to Git
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B build-log
          cp ios/xcode_output.txt ./build-log.txt || true
          git add build-log.txt
          git commit -m "Auto: build failure log" || true
          git push -f origin build-log || true

      - name: Package IPA
        run: |
          cd ios
          mkdir -p Payload
          find build -name "*.app" -exec cp -R {} Payload/ \;
          zip -r -y AlqamiNative.ipa Payload
          ls -lh AlqamiNative.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlqamiNative-iOS
          path: ios/AlqamiNative.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "ALQAMI Native v1.0.0 (iOS IPA)"
          body: "Download AlqamiNative.ipa to install on iPhone."
          files: ios/AlqamiNative.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
