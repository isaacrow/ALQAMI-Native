name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Alqami Native IPA
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' AlqamiNative.xcodeproj/project.pbxproj
          zip -r -y AlqamiNative.xcodeproj.zip AlqamiNative.xcodeproj

      - name: Commit Xcode Project to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios/AlqamiNative.xcodeproj
          if git diff --staged --quiet; then
            echo "No project changes to commit"
          else
            git commit -m "Add pre-generated Xcode project for Xcode 14+ [skip ci]"
            git push origin main
          fi

      - name: Build iOS Application
        run: |
          cd ios
          set -o pipefail
          xcodebuild clean build \
            -project AlqamiNative.xcodeproj \
            -scheme AlqamiNative \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee xcodebuild.log

      - name: Report Build Errors
        if: failure()
        run: |
          cd ios
          echo "## ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -B 2 -A 5 -E "(error:|fatal error:)" xcodebuild.log | head -n 60 >> $GITHUB_STEP_SUMMARY || true
          tail -n 80 xcodebuild.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-failure-log
          path: ios/xcodebuild.log

      - name: Package IPA
        run: |
          cd ios
          mkdir -p Payload
          find build -name "*.app" -exec cp -R {} Payload/ \;
          zip -r -y AlqamiNative.ipa Payload
          ls -lh AlqamiNative.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlqamiNative-iOS
          path: ios/AlqamiNative.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "ALQAMI Native v1.0.0 (iOS IPA)"
          body: "Download AlqamiNative.ipa to install on iPhone."
          files: |
            ios/AlqamiNative.ipa
            ios/AlqamiNative.xcodeproj.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
