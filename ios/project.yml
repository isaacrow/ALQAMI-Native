name: AlqamiNative
options:
  bundleIdPrefix: com.alqami
  deploymentTarget:
    iOS: "17.0"
targets:
  AlqamiNative:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AlqamiNative
        excludes:
          - "Resources/Info.plist"
    info:
      path: AlqamiNative/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alqami.nativeapp
        PRODUCT_NAME: ALQAMI
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AlqamiNative/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: NO
        ENABLE_BITCODE: NO
