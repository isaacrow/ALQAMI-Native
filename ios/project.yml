name: AlqamiNative
options:
  bundleIdPrefix: com.alqami
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "17.0"
targets:
  AlqamiNative:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AlqamiNative
        excludes:
          - "Resources/Info.plist"
    info:
      path: AlqamiNative/Resources/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.alqami.nativeapp
      PRODUCT_NAME: ALQAMI
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "5.9"
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: AlqamiNative/Resources/Info.plist
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      ENABLE_BITCODE: NO
