name: AlqamiNative
options:
  bundleIdPrefix: com.alqami
  xcodeVersion: "14.0"
  deploymentTarget:
    iOS: "16.0"
targets:
  AlqamiNative:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AlqamiNative
        excludes:
          - "Resources/Info.plist"
    info:
      path: AlqamiNative/Resources/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.alqami.nativeapp
      PRODUCT_NAME: ALQAMI
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "5.7"
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: AlqamiNative/Resources/Info.plist
      TARGETED_DEVICE_FAMILY: "1,2"
      ENABLE_BITCODE: NO
